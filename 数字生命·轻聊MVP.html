<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#e8845e">
<title>数字生命 · 轻聊</title>
<style>
:root{
  --bg:#f6f1ea; --card:#fffdfa; --ink:#3d3229; --sub:#9a8b7d;
  --accent:#e8845e; --accent2:#f4a36a; --user:#ccebcd; --line:#eadfd2;
  --ui-opacity:0.3;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:linear-gradient(160deg,#f8f2ec,#f1e7de);
  color:var(--ink);display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}

header{display:flex;align-items:center;gap:12px;padding:12px 16px;
  background:rgba(255,253,250,.75);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(234,223,210,.5);z-index:5}
.avatar{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  position:relative;color:#fff;font-size:22px;font-weight:bold;background:linear-gradient(135deg,var(--accent),var(--accent2));flex:none;overflow:hidden}
.avatar:empty{background:#efe9e1}
.avatar:empty::before{content:'';position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle 11px at 50% 35%,#d8cfc2 98%,rgba(216,207,194,0) 100%),
    radial-gradient(ellipse 36px 22px at 50% 80%,#d8cfc2 98%,rgba(216,207,194,0) 100%);
  background-repeat:no-repeat}
.head{flex:1;min-width:0}
#charName{font-size:16px;font-weight:700}
#stageLine{font-size:12px;color:var(--sub);margin-top:2px}
.aff-bar{height:5px;background:rgba(61,50,41,.08);border-radius:999px;margin-top:7px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(61,50,41,.10)}
.aff-fill{height:100%;width:0%;background:linear-gradient(90deg,#f4a36a,#e8845e);border-radius:999px;transition:width .6s;box-shadow:0 0 6px rgba(232,132,94,.30)}
.avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover}
#btnSettings,#btnInner{width:38px;height:38px;flex:none;border:none;cursor:pointer;border-radius:50%;
  background-color:rgba(61,50,41,.055);background-repeat:no-repeat;background-position:center;background-size:19px;
  color:transparent;font-size:0;line-height:1;transition:background-color .2s,transform .15s}
#btnSettings:hover,#btnInner:hover{background-color:rgba(61,50,41,.10);transform:translateY(-1px)}
#contactPanel{position:absolute;top:56px;left:16px;width:min(300px,88vw);max-height:60vh;background:rgba(255,253,250,.96);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 32px rgba(61,50,41,.15);z-index:25;display:none;overflow:hidden}
#contactPanel.show{display:flex;flex-direction:column}
#contactList{overflow-y:auto;padding:8px;flex:1}
.cp-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;transition:background .15s}
.cp-item:hover{background:rgba(232,132,94,.08)}
.cp-item.active{background:rgba(232,132,94,.14)}
.cp-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:bold;flex:none;overflow:hidden}
.cp-avatar img{width:100%;height:100%;object-fit:cover}
.cp-info{flex:1;min-width:0}
.cp-name{font-size:14px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cp-preview{font-size:11px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cp-del{width:28px;height:28px;border:none;background:transparent;border-radius:50%;cursor:pointer;color:var(--sub);font-size:16px;display:flex;align-items:center;justify-content:center;flex:none;opacity:0;transition:opacity .15s}
.cp-item:hover .cp-del{opacity:1}
.cp-del:hover{background:rgba(192,80,78,.1);color:#c0504e}
.cp-tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:2px}
.cp-tag{font-size:10px;padding:1px 6px;border-radius:8px;background:rgba(120,100,80,.12);color:#8a7a6a;line-height:1.4;white-space:nowrap}
.hdr-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.hdr-tag{font-size:10px;padding:1px 7px;border-radius:8px;background:rgba(255,255,255,.35);color:rgba(255,255,255,.85);backdrop-filter:blur(4px);line-height:1.4;white-space:nowrap}
.cp-foot{padding:8px;border-top:1px solid var(--line);display:flex;justify-content:center}
.cp-add{border:none;background:var(--accent);color:#fff;border-radius:20px;padding:8px 20px;font-size:13px;cursor:pointer;font:inherit;transition:background .2s}
.cp-add:hover{background:var(--accent2)}
#charNameWrap{display:flex;align-items:center;gap:4px;cursor:pointer;user-select:none}
#charNameWrap:hover #charName{color:var(--accent)}
#contactArrow{font-size:10px;color:var(--sub);transition:transform .2s}
#contactArrow.open{transform:rotate(180deg)}
.head.switch-flash #charName,.head.switch-flash #stageLine,.head.switch-flash .aff-fill{animation:switchPulse .35s ease-out}
.avatar.switch-flash{animation:switchPulse .35s ease-out}
@keyframes switchPulse{0%{opacity:.4;transform:scale(.95)}100%{opacity:1;transform:scale(1)}}
#btnInner{background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2224%22%20height%3D%2224%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%235a5147%22%20stroke-width%3D%221.8%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M12%203a6%206%200%200%200-3.96%2010.57c.68.66%201.16%201.28%201.35%202.43h5.22c.19-1.15.67-1.77%201.35-2.43A6%206%200%200%200%2012%203z%22%2F%3E%3Cpath%20d%3D%22M9%2018h6%22%2F%3E%3Cpath%20d%3D%22M10%2021h4%22%2F%3E%3C%2Fsvg%3E")}
#btnSettings{background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2224%22%20height%3D%2224%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%235a5147%22%20stroke-width%3D%221.8%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Ccircle%20cx%3D%2212%22%20cy%3D%2212%22%20r%3D%223%22%2F%3E%3Cpath%20d%3D%22M19.4%2015a1.65%201.65%200%200%200%20.33%201.82l.06.06a2%202%200%201%201-2.83%202.83l-.06-.06a1.65%201.65%200%200%200-1.82-.33%201.65%201.65%200%200%200-1%201.51V21a2%202%200%201%201-4%200v-.09a1.65%201.65%200%200%200-1-1.51%201.65%201.65%200%200%200-1.82.33l-.06.06a2%202%200%201%201-2.83-2.83l.06-.06a1.65%201.65%200%200%200%20.33-1.82%201.65%201.65%200%200%200-1.51-1H3a2%202%200%201%201%200-4h.09a1.65%201.65%200%200%200%201.51-1%201.65%201.65%200%200%200-.33-1.82l-.06-.06a2%202%200%201%201%202.83-2.83l.06.06a1.65%201.65%200%200%200%201.82.33H9a1.65%201.65%200%200%200%201-1.51V3a2%202%200%201%201%204%200v.09a1.65%201.65%200%200%200%201%201.51%201.65%201.65%200%200%200%201.82-.33l.06-.06a2%202%200%201%201%202.83%202.83l-.06.06a1.65%201.65%200%200%200-.33%201.82V9a1.65%201.65%200%200%200%201.51%201H21a2%202%200%201%201%200%204h-.09a1.65%201.65%200%200%200-1.51%201z%22%2F%3E%3C%2Fsvg%3E")}
#innerPanel{position:fixed;top:60px;right:16px;width:min(320px,92vw);background:#f5f2ee;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:12px 14px;z-index:18;display:none}
#innerPanel.show{display:block}
#innerPanel h4{font-size:13px;color:var(--accent);margin-bottom:8px}
#innerPanel .in-item{font-size:12.5px;color:#8a8379;line-height:1.7;margin:8px 0;padding-bottom:8px;border-bottom:1px dashed var(--line)}
#innerPanel .in-item:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
#innerPanel .in-time{color:#b3a99b;font-size:11px;margin-right:6px}
#innerPanel .in-delta{color:var(--accent);font-size:11px;display:block;margin-top:2px}
.avatar.pad-pink{animation:breathPink 2.4s ease-in-out infinite}
.avatar.pad-red{animation:breathRed 1.4s ease-in-out infinite}
.avatar.pad-gray{animation:breathGray 2.8s ease-in-out infinite}
@keyframes breathPink{0%,100%{box-shadow:0 0 0 3px rgba(244,163,170,.30)}50%{box-shadow:0 0 0 9px rgba(244,163,170,.75)}}
@keyframes breathRed{0%,100%{box-shadow:0 0 0 3px rgba(224,84,70,.25)}50%{box-shadow:0 0 0 9px rgba(224,84,70,.65)}}
@keyframes breathGray{0%,100%{box-shadow:0 0 0 3px rgba(150,162,180,.25)}50%{box-shadow:0 0 0 9px rgba(150,162,180,.6)}}
main{flex:1;overflow-y:auto;padding:22px 16px 32px;display:flex;flex-direction:column;gap:18px;
  max-width:720px;width:100%;margin:0 auto}
.empty{color:var(--sub);font-size:14px;text-align:center;margin-top:40px;line-height:2}
.msg{display:flex;flex-direction:row;gap:8px;max-width:88%}
.msg.assistant{align-self:flex-start}
.msg.user{flex-direction:row-reverse;align-self:flex-end}
.msg-col{display:flex;flex-direction:column;max-width:82%}
.msg.user .msg-col{align-items:flex-end}
.msg-avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#e8845e,#f4a36a);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:bold;flex:none;overflow:hidden}
.msg-avatar img{width:100%;height:100%;object-fit:cover}
.msg.user .msg-avatar{background:linear-gradient(135deg,#7fb8a0,#a8d8b9)}
.bubble{padding:10px 14px;border-radius:16px;font-size:15px;line-height:1.65;
  white-space:pre-wrap;word-break:break-word;
  background:rgba(255,255,255,var(--ui-opacity));
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  box-shadow:0 1px 2px rgba(0,0,0,.05)}
.msg.assistant .bubble{background:var(--card);border-bottom-left-radius:4px}
.msg.user .bubble{background:var(--user);border-bottom-right-radius:4px}
.msg.error .bubble{background:#fbe6e2;color:#a1432f;font-size:14px}
.bubble.img-bubble{padding:6px;background:transparent;box-shadow:none}
.msg-system{align-self:center;text-align:center;font-size:12px;color:#aaa;margin:8px 0;padding:0;line-height:1.4;font-style:italic;max-width:90%}
/* Director Mode */
#btnDirector{width:46px;height:46px;flex:none;border:none;border-radius:50%;background-color:#fff;cursor:pointer;
  background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2224%22%20height%3D%2224%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%238b5cf6%22%20stroke-width%3D%221.8%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M12%202l2.4%207.2h7.6l-6%204.8%202.4%207.2-6-4.8-6%204.8%202.4-7.2-6-4.8h7.6z%22%2F%3E%3C%2Fsvg%3E");background-repeat:no-repeat;background-position:center;background-size:21px;
  color:transparent;font-size:0;box-shadow:0 2px 10px rgba(61,50,41,.06);transition:transform .15s,box-shadow .2s}
#btnDirector:hover{transform:translateY(-1px);box-shadow:0 2px 10px rgba(61,50,41,.06),0 0 0 3px rgba(139,92,246,.14)}
#btnDirector.active{background-color:#f3edff;box-shadow:0 0 0 3px rgba(139,92,246,.2),0 2px 10px rgba(139,92,246,.15);
  background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2224%22%20height%3D%2224%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22%238b5cf6%22%20stroke%3D%22%238b5cf6%22%20stroke-width%3D%221.8%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M12%202l2.4%207.2h7.6l-6%204.8%202.4%207.2-6-4.8-6%204.8%202.4-7.2-6-4.8h7.6z%22%2F%3E%3C%2Fsvg%3E")}
#input.director-mode{background:rgba(232,213,245,.25)!important;border-color:rgba(139,92,246,.3)!important;color:#6d28d9}
#input.director-mode::placeholder{color:rgba(139,92,246,.5)}
.msg-director{text-align:center;padding:8px 16px;margin:6px auto;font-size:12px;color:#8b7fa8;font-style:italic;max-width:80%;line-height:1.5}
.msg-director-hint{text-align:center;padding:6px 14px;margin:8px auto;font-size:11px;color:rgba(139,127,168,.5);font-style:italic;cursor:pointer;max-width:70%;transition:opacity .3s,transform .3s}
.msg-director-hint:hover{color:rgba(139,127,168,.8)}
.msg-director-fadein{animation:dirFadeIn .8s ease-out forwards}
@keyframes dirFadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.in-plot{font-size:11px;color:#b8a9c9;font-style:italic;margin-right:4px}
.ctx-menu{position:fixed;z-index:9999;background:#fff;border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.15);padding:4px 0;min-width:120px;display:none}
.ctx-menu.show{display:block}
.ctx-item{padding:10px 18px;font-size:14px;cursor:pointer;color:#333;transition:background .15s}
.ctx-item:hover{background:#f5f5f5}
.ctx-item.danger{color:#d9534f}
.bubble.recalled{background:transparent!important;color:#aaa;font-style:italic;font-size:13px;padding:6px 10px}
img.sticker{max-width:150px;max-height:150px;border-radius:10px;display:block}
.time{font-size:11px;color:var(--sub);margin:4px 4px 0}
.typing{display:flex;gap:5px;padding:14px 16px;background:var(--card);border-radius:16px;
  border-bottom-left-radius:4px;align-self:flex-start;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.typing span{width:7px;height:7px;border-radius:50%;background:#cbbfae;display:inline-block;animation:blink 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1);opacity:1}}
footer{display:flex;gap:10px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  background:rgba(255,253,250,.65);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid rgba(234,223,210,.4)}
footer .wrap{display:flex;gap:10px;max-width:760px;width:100%;margin:0 auto}
textarea{flex:1;resize:none;border:1px solid transparent;border-radius:22px;padding:12px 16px;
  font:inherit;font-size:15px;background:#fff;outline:none;max-height:120px;min-height:46px;line-height:1.5;
  box-shadow:0 2px 10px rgba(61,50,41,.06);transition:box-shadow .2s}
textarea:focus{box-shadow:0 2px 10px rgba(61,50,41,.06),0 0 0 3px rgba(232,132,94,.16)}
#btnSend{width:46px;height:46px;flex:none;border:none;border-radius:50%;cursor:pointer;
  background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2224%22%20height%3D%2224%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%23ffffff%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M22%202%2011%2013%22%2F%3E%3Cpath%20d%3D%22M22%202%2015%2022l-4-9-9-4z%22%2F%3E%3C%2Fsvg%3E") no-repeat center/20px,linear-gradient(135deg,var(--accent),var(--accent2));
  color:transparent;font-size:0;box-shadow:0 3px 8px rgba(232,132,94,.35);transition:transform .15s,box-shadow .2s}
#btnSend:hover{transform:translateY(-1px);box-shadow:0 5px 12px rgba(232,132,94,.45)}
#btnSend:active{transform:scale(.95)}
#btnSend:disabled{opacity:.5;cursor:not-allowed;transform:none}
#btnEmoji{width:46px;height:46px;flex:none;border:none;border-radius:50%;background-color:#fff;cursor:pointer;
  background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2224%22%20height%3D%2224%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%23e8845e%22%20stroke-width%3D%221.8%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Ccircle%20cx%3D%2212%22%20cy%3D%2212%22%20r%3D%229%22%2F%3E%3Cpath%20d%3D%22M8.5%2014.2c.6%201%201.9%201.6%203.5%201.6s2.9-.6%203.5-1.6%22%2F%3E%3Cpath%20d%3D%22M9%209.4h.01%22%2F%3E%3Cpath%20d%3D%22M15%209.4h.01%22%2F%3E%3C%2Fsvg%3E");background-repeat:no-repeat;background-position:center;background-size:21px;
  color:transparent;font-size:0;box-shadow:0 2px 10px rgba(61,50,41,.06);transition:transform .15s,box-shadow .2s}
#btnEmoji:hover{transform:translateY(-1px);box-shadow:0 2px 10px rgba(61,50,41,.06),0 0 0 3px rgba(232,132,94,.14)}
#stickerPanel{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);width:min(440px,94vw);max-height:42vh;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.12);z-index:15;display:none;overflow:hidden}
#stickerPanel.show{display:flex;flex-direction:column}
#stickerGrid{overflow-y:auto;padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px}
.sk{font-size:26px;border:none;background:#f6f1ea;border-radius:10px;padding:6px 4px;cursor:pointer;line-height:1;display:flex;align-items:center;justify-content:center;min-height:44px}
.sk:hover{background:var(--accent2)}
.sk-img{max-width:44px;max-height:44px;object-fit:contain}
.sticker-foot{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-top:1px solid var(--line);font-size:12px;color:var(--sub)}
.avatar-edit{display:flex;gap:8px}
.avatar-edit input{flex:1}
.avatar-preview{width:52px;height:52px;border-radius:50%;object-fit:cover;margin-top:8px;background:var(--line);display:none}
#toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:rgba(60,48,38,.88);color:#fff;
  padding:8px 16px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:30}
#toast.show{opacity:1}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:none;z-index:20}
#overlay.show{display:block}
#panel{position:fixed;right:0;top:0;bottom:0;width:min(430px,94vw);background:var(--bg);
  box-shadow:-4px 0 24px rgba(0,0,0,.12);padding:20px 22px;overflow-y:auto;
  transform:translateX(102%);transition:transform .25s}
#overlay.show #panel{transform:none}
#panel h2{font-size:18px;display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
#btnClose{border:none;background:transparent;font-size:22px;cursor:pointer;color:var(--sub);line-height:1}
#btnClose:hover{color:var(--ink)}
#panel h3{font-size:15px;font-weight:700;margin:22px 0 12px;padding-bottom:8px;color:var(--ink);border-bottom:1px solid rgba(234,223,210,.8)}
#panel label{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px}
#panel input[type=text],#panel input[type=password],#panel input[type=number],#panel select,#panel textarea{
  width:100%;border:1px solid transparent;border-radius:12px;padding:11px 12px;font:inherit;font-size:14px;
  background:#f5f4f1;outline:none;color:var(--ink);transition:background .2s,box-shadow .2s}
#panel input:focus,#panel select:focus,#panel textarea:focus{background:#fff;box-shadow:0 0 0 3px rgba(232,132,94,.13)}
#panel textarea{resize:vertical}
.row{display:flex;gap:10px}.row>div{flex:1}
.modelrow{display:flex;gap:8px}
.modelrow input{flex:1}
#fKey.keymask{-webkit-text-security:disc}
#fKey.keyvisible{-webkit-text-security:none}
button.small{flex:none;border:1px solid transparent;background:transparent;border-radius:10px;padding:8px 12px;font-size:13px;cursor:pointer;color:var(--accent);transition:background .2s}
button.small:hover{background:rgba(232,132,94,.10)}
button.small:disabled{opacity:.4;cursor:not-allowed}
#panel input[type=range]{width:100%;height:20px;-webkit-appearance:none;appearance:none;background:transparent;cursor:pointer}
#panel input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:999px;background:#e8e0d6}
#panel input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:18px;height:18px;border-radius:50%;margin-top:-7px;background:#fff;border:2px solid var(--accent);box-shadow:0 2px 6px rgba(61,50,41,.20)}
#panel input[type=range]::-moz-range-track{height:4px;border-radius:999px;background:#e8e0d6}
#panel input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid var(--accent);box-shadow:0 2px 6px rgba(61,50,41,.20)}
label.check{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink);margin-top:14px;cursor:pointer}
label.check input{accent-color:var(--accent);width:16px;height:16px}
.actions{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.actions button{flex:1;min-width:96px;border:none;border-radius:12px;padding:11px 6px;font:inherit;font-size:14px;cursor:pointer}
#btnSave{background:var(--accent);color:#fff;border-radius:12px;transition:background .2s}
#btnSave:hover{background:var(--accent2)}
#btnSave:hover{background:var(--accent2)}
.ghost{background:transparent;color:#9a8b7d;border:1px solid #e0ddd8!important;border-radius:10px;padding:8px 4px;font-size:13px;cursor:pointer;transition:all .2s}
.ghost:hover{color:var(--accent);border-color:var(--accent)!important}
.danger{background:transparent;color:#c0504e}
.hint{font-size:12px;color:#999;margin-top:18px;line-height:1.8}
#padNow{font-size:13px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:4px 0 0}
#memList{display:none;font-size:12px;color:var(--sub);background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:10px;line-height:1.8;max-height:230px;overflow-y:auto}
#memList.show{display:block}
#memList b{display:block;color:var(--ink);margin-top:8px}

.emotion-mask{position:absolute;inset:0;pointer-events:none;z-index:0;transition:background .8s ease}
.msg{position:relative;z-index:1}

#quietHoursRow input:disabled{opacity:.4;cursor:not-allowed}

/* Settings form alignment */
.settings-panel label,.settings-panel input,.settings-panel select,.settings-panel textarea{display:block;width:100%;box-sizing:border-box}
.settings-panel .check{display:flex!important;width:auto!important;align-items:center;gap:6px}
.settings-panel .avatar-edit{display:flex;gap:6px;align-items:center}
.settings-panel .avatar-edit input{flex:1}</style>
</head>
<body>

<header>
  <div class="avatar" id="avatar">?</div>
  <div class="head">
    <div id="charNameWrap"><div id="charName">未设定角色</div><div id="hdrTags" class="hdr-tags"></div><span id="contactArrow">▾</span></div>
    <div id="stageLine">先在设置里创建你的角色</div>
    <div class="aff-bar"><div class="aff-fill" id="affFill"></div></div>
  </div>
  <button id="btnInner" title="TA 的内心戏">💡</button>
  <button id="btnSettings" title="设置">⚙</button>
</header>

<div id="contactPanel">
  <div id="contactList"></div>
  <div class="cp-foot"><button class="cp-add" id="btnAddContact">＋ 新建联系人</button></div>
</div>
<div id="innerPanel"><h4>TA 的内心戏</h4><div id="innerList"></div></div>
<main id="chat" style="position:relative"><div id="emotionMask" class="emotion-mask"></div></main>

<div id="toast"></div>
<div id="stickerPanel">
  <div id="stickerGrid"></div>
  <div class="sticker-foot">
    <span>点表情插入输入框 · 点表情包直接发送</span>
    <button id="btnStickerAdd" class="small" type="button">＋添加表情包</button>
  </div>
</div>
<input id="stickerFile" type="file" accept="image/*" style="display:none">

<footer>
  <div class="wrap">
    <button id="btnEmoji" title="表情">😊</button>
    <button id="btnDirector" title="剧情模式">✨</button>
    <textarea id="input" rows="1" placeholder="说点什么…（Enter 发送，Shift+Enter 换行）"></textarea>
    <button id="btnSend">发送</button>
  </div>
</footer>

<div id="overlay">
  <div id="panel">
    <h2>角色与连接设置 <button id="btnClose" title="关闭">×</button></h2>

    <h3>① 连接 AI</h3>
    <label>接口地址（Base URL）</label>
    <input id="fBase" type="text" placeholder="https://api.deepseek.com">
    <label>API Key</label>
    <div class="modelrow">
      <input id="fKey" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="sk-..." class="keymask">
      <button id="btnKeyEye" class="small" type="button" title="显示/隐藏 API Key" aria-label="显示/隐藏 API Key">👁</button>
    </div>
    <label>模型（点「获取模型」自动拉取可用列表）</label>
    <div class="modelrow">
      <input id="fModel" type="text" list="modelList" placeholder="deepseek-chat">
      <button id="btnFetchModels" class="small" type="button">获取模型</button>
    </div>
    <div class="modelrow" style="margin-top:8px">
      <span id="goodApiHint" class="hint" style="flex:1">上次可用：暂无</span>
      <button id="btnRestoreApi" class="small" type="button" disabled title="恢复为最近一次验证成功的 API 配置">恢复上次可用</button>
    </div>
    <datalist id="modelList"></datalist>
    <label>温度（越高越随性） <span id="fTempVal">1.2</span></label>
    <input id="fTemp" type="range" min="0" max="2" step="0.1" value="1.2">

    <h3>② 定义 TA 的性格</h3>
    <label>名字</label>
    <input id="fName" type="text" placeholder="比如：林晚">
    <input id="fTags" type="text" placeholder="标签（逗号分隔，如：同桌, 傲娇, 喜欢猫）" style="margin-top:6px">
    <div class="row">
      <div><label>性别</label>
        <select id="fGender"><option>女</option><option>男</option><option>其他</option><option>保密</option></select></div>
      <div><label>年龄</label>
        <input id="fAge" type="number" min="1" max="120" placeholder="24"></div>
    </div>
    <label>与你的关系</label>
    <input id="fRelation" type="text" placeholder="比如：刚认识的朋友 / 恋人">
    <label>性格描述（越具体越像 TA）</label>
    <textarea id="fPersonality" rows="3" placeholder="比如：外冷内热，温柔但有主见，喜欢猫和下雨天，偶尔毒舌，心情不好时会沉默……"></textarea>
    <label>说话风格</label>
    <input id="fStyle" type="text" placeholder="比如：简短口语化，偶尔发颜文字">
    <label>开场白（你们的第一句话）</label>
    <textarea id="fGreeting" rows="2" placeholder="比如：你好呀，我是林晚。"></textarea>

    <h3>③ 关系与行为</h3>
    <label>当前好感度 <span id="fAffVal">20</span></label>
    <input id="fAff" type="range" min="0" max="100" step="1" value="20">
    <label class="check"><input id="fAdmit" type="checkbox" checked> 角色永不承认自己是 AI（推荐）</label>
    <label class="check"><input id="fAllowReject" type="checkbox" checked> 允许拒绝、吃醋与情绪波动（推荐）</label>

    <h3>④ 记忆与情绪</h3>
    <label>TA 当前情绪（PAD · 愉悦/唤醒/支配）</label>
    <div id="padNow"></div>
    <div style="display:flex;gap:8px;margin-top:8px">
      <button id="btnMemToggle" type="button" class="small">查看记忆</button>
      <button id="btnMemClear" type="button" class="small">清空记忆</button> <button id="btnCleanSleep" type="button" class="small">清理睡眠污染</button>
    </div>
    <div id="memList"></div>

    <h3>⑤ 主动与作息</h3>
    <label>主动消息间隔（分钟，0=关闭，60为基准；三档：活泼10-20 / 中性20-30 / 安静30-60）</label>
    <input id="fProactiveMin" type="number" min="0" max="1440" step="10">
    <label>连发倾向（角色回完一条后，是否用 | 分段再追发消息的倾向）</label>
    <select id="fChatter">
      <option value="auto">性格自动（推荐）</option>
      <option value="low">低</option>
      <option value="mid">中</option>
      <option value="high">高</option>
      <option value="off">关（严格一问一答）</option>
    </select>
    <label class="check"><input id="fNightQuiet" type="checkbox" checked> 开启夜间免打扰</label>
    <div id="quietHoursRow" style="display:flex;gap:8px;align-items:center;margin:6px 0 2px">
      <span style="font-size:13px;color:#9a8b7d">从</span>
      <input id="fSleepStart" type="time" value="23:00" style="flex:1;padding:6px 10px;border:none;border-radius:10px;background:#F5F4F1;font-size:14px;color:#3d3229">
      <span style="font-size:13px;color:#9a8b7d">到</span>
      <input id="fSleepEnd" type="time" value="07:00" style="flex:1;padding:6px 10px;border:none;border-radius:10px;background:#F5F4F1;font-size:14px;color:#3d3229">
    </div>
    <button id="btnCleanSleep" class="small" style="width:100%;margin-top:6px">🧹 清理睡眠污染</button>

    <h3>⑥ 语言习惯</h3>
    <label>口头禅 / 常用语（多条用 | 分隔，留空则无）</label>
    <input id="fCatchphrases" type="text" placeholder="例如：真受不了你 | 随便你啦 | 算你厉害">

    <h3>⑦ 头像与表情</h3>
    <label>TA 的头像</label>
    <div class="avatar-edit">
      <input id="fTaAvatar" type="text" placeholder="图片 URL（选填）">
      <button id="btnTaAvatarUpload" class="small" type="button">上传</button>
      <button id="btnTaAvatarClear" class="small" type="button">清除</button>
    </div>
    <img id="taAvatarPreview" class="avatar-preview" alt="">
    <label>我的头像</label>
    <div class="avatar-edit">
      <input id="fUserAvatar" type="text" placeholder="图片 URL（选填）">
      <button id="btnUserAvatarUpload" class="small" type="button">上传</button>
      <button id="btnUserAvatarClear" class="small" type="button">清除</button>
    </div>
    <img id="userAvatarPreview" class="avatar-preview" alt="">
    <label class="check"><input id="fHideAvatars" type="checkbox"> 隐藏聊天中的头像</label>

    <h3 style="margin-top:32px;font-weight:700;font-size:15px;border-bottom:1px solid #eee;padding-bottom:8px;margin-bottom:16px">⑧ 背景与外观</h3>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <label style="margin:0">背景模式</label>
      <select id="fBgMode" style="width:auto;min-width:120px">
        <option value="solid">纯色</option>
        <option value="warm">暖阳渐变</option>
        <option value="calm">静谧渐变</option>
        <option value="cool">清冷渐变</option>
      </select>
    </div>
    <label class="check" style="margin-bottom:10px"><input type="checkbox" id="fEmotionLink"> 开启后背景随 TA 的情绪变化</label>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
      <label style="margin:0">视觉遮罩透明度</label>
      <span id="fBgOpVal" style="font-size:13px;color:#9a8b7d">0.3</span>
    </div>
    <input id="fBgOpacity" type="range" min="0" max="1" step="0.05" value="0.3" style="width:100%">

    <div style="margin-top:16px;padding-top:12px;border-top:1px solid rgba(0,0,0,.06)">
      <label style="font-size:13px;color:#9a8b7d;margin-bottom:4px;display:block">剧情提示文字</label>
      <input id="fDirectorHint" type="text" placeholder="[你设定了新剧情]" style="width:100%;margin-bottom:8px">
      <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:#6b5e52;cursor:pointer">
        <input id="fDirectorHide" type="checkbox"> 不在聊天界面显示提示文字
      </label>
    </div>

    <div style="margin-top:32px">
      <button id="btnSave" style="width:100%;padding:12px;font-size:15px;font-weight:600;border:none;border-radius:12px;background:var(--accent);color:#fff;cursor:pointer;margin-bottom:10px">保存</button>
      <div style="display:flex;gap:8px">
        <button id="btnClear" class="ghost" style="flex:1">清空聊天</button>
        <button id="btnGenTopic" class="ghost" style="flex:1">🎲 今日话题</button>
        <button id="btnReset" class="ghost" style="flex:1">恢复出厂</button>
      </div>
      <div id="topicStatus" class="hint" style="margin-top:6px;text-align:center"></div>
    </div>
  </div>
    <p class="hint">所有数据只保存在本机浏览器（localStorage）。聊天内容只会发送给你填写的 AI 接口地址，不会发往其他任何地方。直接双击打开本文件即可使用。</p>
  </div>
</div>

<script>
var LS_SET = 'dls_settings_v1';
var LS_CHAT = 'dls_chat_v1';
var NL = String.fromCharCode(10);
var settings = {
  base: 'https://api.deepseek.com', key: '', model: 'deepseek-chat', temp: 1.2,
  name: '', gender: '女', age: '', relation: '朋友',
  personality: '', style: '', greeting: '',
  aff: 20, neverAdmit: true,
  avatar: '', avatarUser: '', hideAvatars: false, stickers: [],
  proactiveMin: 60, nightQuiet: true, sleepStart: '23:00', sleepEnd: '07:00', allowReject: true, catchphrases: '', chatter: 'auto',
  bgMode: 'warm', emotionLink: false, bgOpacity: 0.3,
  directorHint: '[你设定了新剧情]', directorHide: false
};
var chat = [];
var busy = false;
var LS_MEM = 'dls_mem_v1';
var LS_PAD = 'dls_pad_v1';
var mem = { facts: [], events: [] };
var keyDraft = '';
var keyShown = false;
var LS_GOOD = 'dls_good_api_v1';
var goodAPI = { base: '', key: '', model: '' };
var pad = { p: 6, a: 5, d: 5, history: [] };
var lastActivity = Date.now();
var proactiveTimer = null;
var proactiveDueAt = 0;
var LS_INNER = 'dls_inner_v1';
var LS_CONTACTS = 'dls_contacts_v1';
var contacts = { activeId: '', list: [] };
var CONTACT_MAX = 20;
var innerLogs = [];
var lastRecallTs = 0;
var ctxTarget = -1;
var longPressTimer = null;
var isRendering = false;
var renderTimers = [];

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function stageOf(v){ if(v < 10) return '陌生'; if(v < 30) return '初识'; if(v < 45) return '熟悉'; if(v < 65) return '好友'; if(v < 80) return '知己'; return '亲密'; }
function fmt(t){ var d = new Date(t); var h = d.getHours(); var m = d.getMinutes(); return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m; }

function loadSettings(){
  try{
    var o = JSON.parse(localStorage.getItem(LS_SET));
    if(o){ for(var k in o){ if(Object.prototype.hasOwnProperty.call(o, k)) settings[k] = o[k]; } }
  }catch(e){}
  if(!settings.base) settings.base = 'https://api.deepseek.com';
  if(!settings.model) settings.model = 'deepseek-chat';
  if(typeof settings.aff !== 'number') settings.aff = 20;
  if(typeof settings.temp !== 'number') settings.temp = 1.2;
  if(typeof settings.neverAdmit !== 'boolean') settings.neverAdmit = true;
  if(typeof settings.avatar !== 'string') settings.avatar = '';
  if(typeof settings.avatarUser !== 'string') settings.avatarUser = '';
  if(typeof settings.hideAvatars !== 'boolean') settings.hideAvatars = false;
  if(!Array.isArray(settings.stickers)) settings.stickers = [];
  if(typeof settings.proactiveMin !== 'number') settings.proactiveMin = 60;
  if(typeof settings.nightQuiet !== 'boolean') settings.nightQuiet = true;
    if(typeof settings.sleepStart !== 'string') settings.sleepStart = '23:00';
    if(typeof settings.sleepEnd !== 'string') settings.sleepEnd = '07:00';
  if(typeof settings.allowReject !== 'boolean') settings.allowReject = true;
  if(typeof settings.catchphrases !== 'string') settings.catchphrases = '';
  if(typeof settings.bgImg !== 'string') settings.bgImg = '';
  if(typeof settings.bgOpacity !== 'number') settings.bgOpacity = 0.3;
  if(settings.chatter !== 'auto' && settings.chatter !== 'low' && settings.chatter !== 'mid' && settings.chatter !== 'high' && settings.chatter !== 'off') settings.chatter = 'auto';
}
function saveSettings(){
  try{ localStorage.setItem(LS_SET, JSON.stringify(settings)); }
  catch(e){ toast('保存失败：本地存储空间不足，可删除部分表情包'); }
  var ac = getActiveContact();
  if(ac){ ac.settings = JSON.parse(JSON.stringify(settings)); ac.name = settings.name || ac.name; saveContacts(); }
}
function normalizeBase(u){
  u = (u || '').trim();
  if(u.slice(-17) === '/chat/completions') u = u.slice(0, -17);
  while(u.charAt(u.length - 1) === '/') u = u.slice(0, -1);
  return u;
}
function loadGoodAPI(){
  try{
    var o = JSON.parse(localStorage.getItem(LS_GOOD));
    if(o && o.key){ goodAPI = o; }
  }catch(e){}
  if(!goodAPI.key && settings.key){
    goodAPI = { base: normalizeBase(settings.base), key: settings.key, model: settings.model };
    saveGoodAPI();
  }
}
function saveGoodAPI(){ try{ localStorage.setItem(LS_GOOD, JSON.stringify(goodAPI)); }catch(e){} }
function recordGoodAPI(base, key, model){
  goodAPI = { base: normalizeBase(base), key: (key || '').trim(), model: (model || '').trim() };
  saveGoodAPI();
  renderGoodApiHint();
}
function apiDraft(){
  return { base: normalizeBase($('fBase').value), key: keyDraft.trim(), model: $('fModel').value.trim() || 'deepseek-chat' };
}
function apiDirty(d){
  if(!goodAPI.key) return false;
  return d.base !== normalizeBase(goodAPI.base) || d.key !== goodAPI.key || d.model !== (goodAPI.model || 'deepseek-chat');
}
function renderGoodApiHint(){
  var el = $('goodApiHint');
  var btn = $('btnRestoreApi');
  if(!el) return;
  if(goodAPI.key){
    el.textContent = '上次可用：' + String(goodAPI.base || '').replace(/^https?:\/\//, '') + ' · ' + (goodAPI.model || 'deepseek-chat');
    if(btn) btn.disabled = false;
  } else {
    el.textContent = '上次可用：暂无（点「获取模型」或成功聊一句后记录）';
    if(btn) btn.disabled = true;
  }
}
function restoreGoodAPI(){
  if(!goodAPI.key){ toast('还没有记录到可用 API'); return; }
  settings.base = normalizeBase(goodAPI.base) || 'https://api.deepseek.com';
  settings.key = goodAPI.key;
  settings.model = goodAPI.model || 'deepseek-chat';
  keyDraft = settings.key;
  saveSettings();
  $('fBase').value = settings.base;
  $('fModel').value = settings.model;
  applyKeyMask();
  renderGoodApiHint();
  toast('已恢复并保存为上次可用的 API');
}
function loadChat(){
  try{
    var c = JSON.parse(localStorage.getItem(LS_CHAT));
    if(Array.isArray(c)) chat = c;
  }catch(e){}
  if(chat.length === 0 && settings.greeting){
    chat.push({ role: 'assistant', content: settings.greeting, t: Date.now() });
  }
}
function saveChat(){ localStorage.setItem(LS_CHAT, JSON.stringify(chat));
  var ac = getActiveContact(); if(ac){ ac.chat = JSON.parse(JSON.stringify(chat)); saveContacts(); }
}

function loadMem(){
  try{
    var o = JSON.parse(localStorage.getItem(LS_MEM));
    if(o){
      mem = {
        facts: Array.isArray(o.facts) ? o.facts.filter(function(x){ return typeof x === 'string'; }).slice(0, 200) : [],
        events: Array.isArray(o.events) ? o.events.filter(function(x){ return x && typeof x.text === 'string'; }).slice(-300) : [],
        diaryAt: (typeof o.diaryAt === 'number' && o.diaryAt >= 0) ? o.diaryAt : 0
      };
    }
  }catch(e){}
}
function saveMem(){
  try{ localStorage.setItem(LS_MEM, JSON.stringify(mem)); }
  catch(e){ toast('记忆保存失败：本地空间可能已满'); }
  var ac = getActiveContact(); if(ac){ ac.mem = JSON.parse(JSON.stringify(mem)); saveContacts(); }
}
function addFact(t){
  t = String(t || '').trim();
  if(!t || t.length > 120) return;
  if(!mem || !Array.isArray(mem.facts)) mem.facts = [];
  for(var i = 0; i < mem.facts.length; i++){
    if(mem.facts[i] === t) return;
    if(t.indexOf(mem.facts[i]) >= 0){ mem.facts[i] = t; saveMem(); return; }
    if(mem.facts[i].indexOf(t) >= 0) return;
  }
  mem.facts.push(t);
  if(mem.facts.length > 200) mem.facts.shift();
  saveMem();
}
function addEvent(t){
  t = String(t || '').trim();
  if(!t || t.length > 200) return;
  if(!mem || !Array.isArray(mem.events)) mem.events = [];
  mem.events.push({ t: Date.now(), text: t });
  if(mem.events.length > 300) mem.events.shift();
  saveMem();
}
function loadPad(){
  try{
    var o = JSON.parse(localStorage.getItem(LS_PAD));
    if(o){
      if(typeof o.p === 'number') pad.p = Math.max(1, Math.min(10, Math.round(o.p)));
      if(typeof o.a === 'number') pad.a = Math.max(1, Math.min(10, Math.round(o.a)));
      if(typeof o.d === 'number') pad.d = Math.max(1, Math.min(10, Math.round(o.d)));
      if(Array.isArray(o.history)) pad.history = o.history.slice(-80);
    }
  }catch(e){}
}

function setPad(p, a, d){
  p = Math.round(Number(p)); a = Math.round(Number(a)); d = Math.round(Number(d));
  if(!(p >= 1 && p <= 10) || !(a >= 1 && a <= 10) || !(d >= 1 && d <= 10)) return;
  if(!pad || typeof pad !== 'object') pad = {p:5,a:5,d:5};
  if(!Array.isArray(pad.history)) pad.history = [];
  pad.p = p; pad.a = a; pad.d = d;
  pad.history.push({ t: Date.now(), p: p, a: a, d: d });
  if(pad.history.length > 80) pad.history.shift();
  try{ localStorage.setItem(LS_PAD, JSON.stringify(pad)); }catch(e){}
  applyPADVisual();
  updateEmotionMask();
}

function extractRecentNouns(){
  try{
    var recent = chat.slice(-10).filter(function(m){return m.role==='user'});
    if(!recent.length) return [];
    var text = recent.map(function(m){return m.content||''}).join(' ');
    var nouns = [];
    var patterns = [/[\u4e00-\u9fa5]{2,4}(?:奶茶|咖啡|作业|考试|电影|游戏|音乐|小说|美食|火锅|烧烤|甜品|蛋糕|炸鸡|汉堡|寿司|拉面|米饭|面条|水果|零食|饮料|啤酒|红酒)/g,
      /(?:看|吃|喝|玩|打|听|读|写|买|做|学|练|考|试)(?:了|过|完)?[\u4e00-\u9fa5]{2,4}/g];
    for(var p=0;p<patterns.length;p++){
      var ms = text.match(patterns[p]);
      if(ms) for(var i=0;i<ms.length&&nouns.length<5;i++) nouns.push(ms[i]);
    }
    return nouns.filter(function(v,i,a){return a.indexOf(v)===i});
  }catch(e){return [];}
}

function generateFallbackTopic(){
  var act = TOPIC_ACTIONS[Math.floor(Math.random()*TOPIC_ACTIONS.length)];
  var emo = TOPIC_EMOTIONS[Math.floor(Math.random()*TOPIC_EMOTIONS.length)];
  var inter = TOPIC_INTERACTIONS[Math.floor(Math.random()*TOPIC_INTERACTIONS.length)];
  var sentence = act + '，' + emo + '，' + inter;
  var tags = (settings.tags || []).map(function(t){return t.toLowerCase()});
  var isTsuya = tags.some(function(t){return t.indexOf('傲娇')>=0||t.indexOf('毒舌')>=0||t.indexOf('高冷')>=0});
  var isGenki = tags.some(function(t){return t.indexOf('元气')>=0||t.indexOf('活泼')>=0||t.indexOf('开朗')>=0});
  if(isTsuya && Math.random()>0.4){
    sentence += TOPIC_TSUYA_SUFFIX[Math.floor(Math.random()*TOPIC_TSUYA_SUFFIX.length)];
  } else if(isGenki && Math.random()>0.3){
    sentence = sentence.replace(/[。！？]$/,'') + TOPIC_GENKI_SUFFIX[Math.floor(Math.random()*TOPIC_GENKI_SUFFIX.length)];
  }
  return sentence;
}

function refillFallbackPool(){
  try{
    var existing = loadTopics();
    if(existing.length >= 5) return;
    var nouns = extractRecentNouns();
    var newTopics = [];
    if(nouns.length && Math.random()>0.5){
      var noun = nouns[Math.floor(Math.random()*nouns.length)];
      var templates = ['你之前说的'+noun+'，后来怎么样了？','说到'+noun+'，我突然好奇你的看法','那个'+noun+'的事你还记得吗','关于'+noun+'我想和你聊聊','你上次提的'+noun+'，有后续吗'];
      newTopics.push(templates[Math.floor(Math.random()*templates.length)]);
    }
    while(newTopics.length < 5){
      var t = generateFallbackTopic();
      if(newTopics.indexOf(t)<0 && existing.indexOf(t)<0) newTopics.push(t);
      if(newTopics.length + existing.length >= 10) break;
    }
    var merged = existing.concat(newTopics);
    var deduped = [];
    for(var i=0;i<merged.length&&deduped.length<10;i++){
      if(deduped.indexOf(merged[i])<0) deduped.push(merged[i]);
    }
    saveTopics(deduped);
  }catch(e){}
}

function silentPreGenerate(){
  try{
    var s = settings;
    if(!s.base || !s.key || !s.model) return;
    var existing = loadTopics();
    if(existing.length >= 5) return;
    var prompt = '你正在扮演'+(s.name||'角色')+'。';
    if(s.personality) prompt += '性格：'+s.personality+'。';
    if(Array.isArray(s.tags)&&s.tags.length) prompt += '标签：'+s.tags.join('、')+'。';
    prompt += '关系：'+(s.relation||'朋友')+'。请生成5条日常聊天话题，每行一条，不要序号。';
    var url = s.base.trim();
    while(url.charAt(url.length-1)==='/') url=url.slice(0,-1);
    if(url.indexOf('/chat/completions')<0) url+='/chat/completions';
    fetch(url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+s.key},
      body:JSON.stringify({model:s.model,temperature:0.9,max_tokens:1500,stream:false,messages:[{role:'user',content:prompt}]})
    }).then(function(r){return r.json()}).then(function(data){
      var msg=data.choices&&data.choices[0]&&data.choices[0].message;
      var content=msg&&(msg.content||'');
      if(!content) return;
      var lines=content.split(/\r?\n/).map(function(l){return l.replace(/^\d+[\.\)、]\s*/,'').trim()}).filter(Boolean);
      if(lines.length){
        var cur=loadTopics();
        var merged=cur.concat(lines);
        var deduped=[];
        for(var i=0;i<merged.length&&deduped.length<10;i++){if(deduped.indexOf(merged[i])<0)deduped.push(merged[i]);}
        saveTopics(deduped);
      }
    }).catch(function(){});
  }catch(e){}
}
async function generateTopics(){
  var statusEl = $('topicStatus');
  if(statusEl) statusEl.textContent = '生成中…';
  try{
    var s = settings;
    var prompt = '你正在扮演' + (s.name||'角色') + '。';
    if(s.personality) prompt += '性格：' + s.personality + '。';
    if(Array.isArray(s.tags) && s.tags.length) prompt += '标签：' + s.tags.join('、') + '。';
    prompt += '关系：' + (s.relation||'朋友') + '。请根据角色的性格、人设、关系和标签，生成5条符合日常的真实聊天话题（比如吐槽天气、问作业、分享趣事），每行一条，不要带数字序号。';
    var url = s.base.trim();
    while(url.charAt(url.length-1)==='/') url=url.slice(0,-1);
    if(url.indexOf('/chat/completions')<0) url+='/chat/completions';
    var resp = await fetch(url, {
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+s.key},
      body:JSON.stringify({model:s.model,temperature:0.9,max_tokens:1500,stream:false,messages:[{role:'user',content:prompt}]})
    });
    if(!resp.ok) throw new Error('HTTP '+resp.status);
    var data = await resp.json();
    var msg = data.choices && data.choices[0] && data.choices[0].message;
    var content = msg && (msg.content || '');
    var lines = content ? content.split(/\r?\n/).map(function(l){return l.replace(/^\d+[\.\)、]\s*/, '').trim()}).filter(Boolean) : [];
    if(!lines.length){
      refillFallbackPool();
      var fb = loadTopics();
      if(fb.length){
        if(statusEl) statusEl.textContent = '🌙 AI 正在神游，已用本地话题补充~';
        toast('AI 正在神游，已用本地话题补充~');
      } else {
        if(statusEl) statusEl.textContent = '🌙 话题生成中，请稍后再试';
        toast('话题池为空，请重试');
      }
      return;
    }
    saveTopics(lines);
    if(statusEl) statusEl.textContent = '✅ 已生成 ' + lines.length + ' 条话题';
    toast('已生成 ' + lines.length + ' 条今日话题');
  }catch(e){
    refillFallbackPool();
    var fb = loadTopics();
    if(fb.length){
      if(statusEl) statusEl.textContent = '🌙 AI 正在神游，已用本地话题补充~';
      toast('AI 正在神游，已用本地话题补充~');
    } else {
      if(statusEl) statusEl.textContent = '🌙 话题生成中，请稍后再试';
      toast('话题池为空，请重试');
    }
  }
}

function toggleContactPanel(){
  var p = $('contactPanel'); var a = $('contactArrow');
  if(!p) return;
  var isOpen = p.classList.contains('show');
  if(isOpen){ p.classList.remove('show'); if(a) a.classList.remove('open'); }
  else { renderContactPanel(); p.classList.add('show'); if(a) a.classList.add('open'); }
}
function closeContactPanel(){
  var p = $('contactPanel'); var a = $('contactArrow');
  if(p) p.classList.remove('show');
  if(a) a.classList.remove('open');
}

function headerUI(){
  $('charName').textContent = settings.name || '未设定角色';
  var htEl = $('hdrTags');
  if(htEl){
    var tg = settings.tags || [];
    htEl.innerHTML = tg.map(function(t){return '<span class="hdr-tag">'+t+'</span>'}).join('');
  }
  $('stageLine').textContent = settings.name
    ? (stageOf(settings.aff) + ' · 好感度 ' + settings.aff)
    : '先在设置里创建你的角色';
  $('affFill').style.width = settings.aff + '%';
  setAvatarEl($('avatar'), settings.avatar, settings.name ? settings.name.charAt(0) : '');
  applyPADVisual();

  applyAppearance();
}

function renderChat(){
  var c = $('chat');
  c.innerHTML = '';
  if(chat.length === 0 && !busy){
    var e = document.createElement('div');
    e.className = 'empty';
    e.textContent = '还没有对话。点右上角 ⚙ 创建你的角色。';
    c.appendChild(e);
  }
  for(var i = 0; i < chat.length; i++){
    var m = chat[i];
    if(m.role === 'system'){
      var sd = document.createElement('div');
      if(m._director){
        sd.className = 'msg-director';
        sd.textContent = m.content;
      } else {
        sd.className = 'msg-system';
        sd.textContent = m.content;
      }
      c.appendChild(sd);
      continue;
    }
    var isUser = m.role === 'user';
    var cls = isUser ? 'user' : (m.role === 'error' ? 'error' : 'assistant');
    var d = document.createElement('div');
    d.className = 'msg ' + cls;
    d.setAttribute('data-idx', i);
    if(!settings.hideAvatars){
      var av = document.createElement('div');
      av.className = 'msg-avatar';
      var avSrc = isUser ? settings.avatarUser : settings.avatar;
      if(avSrc){
        var aim = document.createElement('img');
        aim.src = avSrc;
        av.appendChild(aim);
      } else {
        av.textContent = isUser ? '我' : (settings.name ? settings.name.charAt(0) : 'TA');
      }
      d.appendChild(av);
    }
    var col = document.createElement('div');
    col.className = 'msg-col';
    var b = document.createElement('div');
    if(m.img){
      b.className = 'bubble img-bubble';
      var im = document.createElement('img');
      im.className = 'sticker';
      im.src = m.img;
      b.appendChild(im);
    } else {
      b.className = 'bubble';
      b.textContent = m.content;
    }
    b.setAttribute('data-timestamp', m.t || 0);
    col.appendChild(b);
    var t = document.createElement('div');
    t.className = 'time';
    t.textContent = fmt(m.t || Date.now());
    col.appendChild(t);
    d.appendChild(col);
    (function(idx, bubble, isU){
      bubble.addEventListener('contextmenu', function(ev){ ev.preventDefault(); showCtxMenu(ev.clientX, ev.clientY, idx, isU); });
      var lpt = null;
      bubble.addEventListener('touchstart', function(ev){ lpt = setTimeout(function(){ showCtxMenu(ev.touches[0].clientX, ev.touches[0].clientY, idx, isU); }, 600); }, {passive:true});
      bubble.addEventListener('touchend', function(){ clearTimeout(lpt); });
      bubble.addEventListener('touchmove', function(){ clearTimeout(lpt); });
    })(i, b, isUser);
    c.appendChild(d);
  }
  if(busy){
    var ty = document.createElement('div');
    ty.className = 'typing';
    ty.innerHTML = '<span></span><span></span><span></span>';
    c.appendChild(ty);
  }
  c.scrollTop = c.scrollHeight;
}

function memSection(){
  var f = mem.facts.length ? mem.facts.join('；') : '暂无';
  var evs = mem.events.slice(-12).map(function(e){ return fmt(e.t) + ' ' + e.text; }).join('；') || '暂无';
  return '你对对方的记忆——长期事实：' + f + '。事件日记（最近发生的）：' + evs + '。聊天时自然用到你记得的事但不要逐条复述，让关心和回应有连续性。';
}

function recentMsgs(){
  var arr = [];
  for(var i = chat.length - 1, c = 0; i >= 0 && c < 10; i--){
    var m = chat[i];
    if(m._director){
      arr.unshift({ role: 'system', content: '[暗中设定：' + m._director + ']' });
      c++;
    } else if(m.role === 'user' || m.role === 'assistant'){
      arr.unshift({ role: m.role, content: m.img ? '[发来一张表情包]' : m.content });
      c++;
    }
  }
  if(lastRecallTs && Date.now() - lastRecallTs < 120000){
    arr.push({ role: 'system', content: '[User recalled a message just now. Please respond naturally without mentioning the recall unless the user brings it up.]' });
  }
  return arr;
}

function parseReply(raw){
  var text = String(raw == null ? '' : raw);
  var padRe = /(?:\[\[PAD\]\]|\[PAD\]|【PAD】)\s*[:：]?\s*(\d{1,2})\s*[,，、\s\/]\s*(\d{1,2})\s*[,，、\s\/]\s*(\d{1,2})/i;
  var pm = text.match(padRe);
  var oldPad = { p: pad.p, a: pad.a, d: pad.d };
  var deltaLabel = '';
  if(pm){ setPad(pm[1], pm[2], pm[3]); }
  // ★ 提取所有 [[内心]]...[[/内心]] 或 [[内心]]... 内容，合并为一条，从主文本中彻底清除
  var innerExtracted = '';
  var innerAllRe = /\[\[内心\]\]([\s\S]*?)(?=\[\[|$)/g;
  var innerCloseRe = /\[\[\/内心\]\]/g;
  var im;
  var innerParts = [];
  while((im = innerAllRe.exec(text))){
    var chunk = im[1].replace(innerCloseRe, '').trim();
    if(chunk) innerParts.push(chunk);
  }
  if(innerParts.length > 0){
    innerExtracted = innerParts.join('，').replace(/[\r\n]+/g, '').replace(/\s{2,}/g, ' ').trim();
  }
  text = text.replace(/\[\[内心\]\][\s\S]*?(?=\[\[(?!内心)|$)/g, '').replace(innerCloseRe, '');
  // 预处理：把行内的 | 分隔符拆成独立行
  text = text.replace(/([^\]\n])\s*[|｜]\s*([^\[\n])/g, '$1\n|\n$2');
  text = text.replace(/([^\]\n])\s*[|｜]\s*(\[\[)/g, '$1\n|\n$2');
  var lines = text.split(/\r?\n/);
  var parts = [], cur = [];
  var facts = [], events = [], diary = '';
  function flush(){ var t = cur.join(NL).replace(/^\s+/, '').replace(/\s+$/, ''); if(t) parts.push(t); cur = []; }
  for(var i = 0; i < lines.length; i++){
    var line = lines[i];
    if(/^\s*[|｜]\s*$/.test(line)){ flush(); continue; }
    // [[内心]] already extracted above; skip any remnants
    line = line.replace(/\[\[内心\]\][^\[\]]*/g, '').replace(/\[\[\/内心\]\]/g, '');
    var dRe = /\[\[日记\]\]([^\[\]]+)/g, m3;
    while((m3 = dRe.exec(line))){ diary += m3[1].trim(); }
    line = line.replace(/\[\[日记\]\][^\[\]]+/g, '');
    var fRe = /\[\[事实\]\]([^\[\]]+)/g, eRe = /\[\[事件\]\]([^\[\]]+)/g, m;
    while((m = fRe.exec(line))){ facts.push(m[1].trim()); }
    line = line.replace(/\[\[事实\]\][^\[\]]+/g, '');
    while((m = eRe.exec(line))){ events.push(m[1].trim()); }
    line = line.replace(/\[\[事件\]\][^\[\]]+/g, '');
    line = line.replace(padRe, ' ');
    line = line.replace(/[ \t]{2,}/g, ' ').trim();
    if(line) cur.push(line);
  }
  flush();
  if(parts.length > 3) parts = parts.slice(0, 3);
  for(var j = 0; j < facts.length; j++){ addFact(facts[j]); }
  for(var k = 0; k < events.length; k++){ addEvent(events[k]); }
  if(diary){
    if(diary.length > 120) diary = diary.slice(0, 120);
    addEvent('[小结] ' + diary);
  }
  var inner = innerExtracted;
  if(inner){
    if(inner.length > 80) inner = inner.slice(0, 80);
    var diff = [['愉悦', pad.p - oldPad.p], ['唤醒', pad.a - oldPad.a], ['支配', pad.d - oldPad.d]];
    if((diff[0][1] || diff[1][1] || diff[2][1]) && Math.random() < 0.3){
      var pick = null;
      for(var di = 0; di < 3; di++){
        if(diff[di][1] && (!pick || Math.abs(diff[di][1]) > Math.abs(pick[1]))) pick = diff[di];
      }
      if(pick) deltaLabel = pick[0] + (pick[1] > 0 ? '+' : '') + pick[1];
    }
    addInner(inner, deltaLabel);
  }
  // Check for [[RECALL]] marker in any part
  var recallIdx = -1;
  for(var ri = 0; ri < parts.length; ri++){
    if(parts[ri].indexOf('[[RECALL]]') >= 0){ recallIdx = ri; break; }
  }
  var hasRecall = recallIdx >= 0;
  if(hasRecall){
    var rp = parts[recallIdx];
    var splitPos = rp.indexOf('[[RECALL]]');
    var beforeRecall = rp.slice(0, splitPos).trim();
    parts = beforeRecall ? parts.slice(0, recallIdx).concat([beforeRecall]) : parts.slice(0, recallIdx);
    if(!parts.length) parts = ['（对方欲言又止）'];
  }
  return { parts: parts.length ? parts : ['（对方没有回应）'], inner: inner, diary: diary, delta: deltaLabel, recall: hasRecall };
}

function affDelta(text){
  var neg = [['分手',-6],['不喜欢你',-4],['再也不理你',-4],['你好烦',-2],['别烦我',-2],['离我远点',-2],['讨厌',-2],['闭嘴',-2],['骗子',-3],['废物',-2],['傻逼',-2],['冷漠',-1]];
  var pos = [['我爱你',3],['我喜欢你',3],['喜欢你',2],['爱你',2],['想你',2],['有你在',2],['抱抱',2],['亲亲',2],['谢谢你',1],['辛苦',1],['好温柔',1],['真棒',1],['厉害',1],['晚安',1],['早安',1],['陪你',1],['可爱',1],['好看',1]];
  var d = 0, i;
  for(i = 0; i < neg.length; i++){ if(text.indexOf(neg[i][0]) >= 0){ d += neg[i][1]; break; } }
  for(i = 0; i < pos.length; i++){ if(text.indexOf(pos[i][0]) >= 0) d += pos[i][1]; }
  return Math.max(-6, Math.min(6, d));
}

function addAff(d){
  if(!d) return;
  settings.aff = Math.max(0, Math.min(100, settings.aff + d));
  saveSettings();
  headerUI();
  toast((d > 0 ? '+' : '') + d + ' 好感');
}

function isNightQuiet(){
  if(!settings.nightQuiet) return false;
  var now = new Date();
  var cur = now.getHours() * 60 + now.getMinutes();
  var ss = (settings.sleepStart || '23:00').split(':');
  var se = (settings.sleepEnd || '07:00').split(':');
  var start = parseInt(ss[0],10) * 60 + parseInt(ss[1],10);
  var end = parseInt(se[0],10) * 60 + parseInt(se[1],10);
  if(start < end){ return cur >= start && cur <= end; }
  else { return cur >= start || cur <= end; }
}

function charEnergy(){
  var t = ((settings.personality || '') + ' ' + (settings.style || ''));
  if(/活泼|开朗|热情|外向|话痨|粘人|主动|元气|自来熟/.test(t)) return 2;
  if(/高冷|内向|安静|社恐|被动|冷淡|慢热|闷/.test(t)) return 0;
  return 1;
}

function randInt(a, b){
  a = Math.ceil(a); b = Math.floor(b);
  return a + Math.floor(Math.random() * (b - a + 1));
}
function proactiveTiers(){
  var scale = Math.max(0.2, (settings.proactiveMin || 60) / 60);
  var en = charEnergy();
  var lo = 20, hi = 30;
  if(en === 2){ lo = 10; hi = 20; }
  else if(en === 0){ lo = 30; hi = 60; }
  return [Math.round(lo * scale), Math.round(hi * scale)];
}
function nextProactiveWait(){
  var t = proactiveTiers();
  if(t[1] < t[0] + 1) t[1] = t[0] + 1;
  return randInt(t[0], t[1]) * 60000;
}
function armProactive(ms){
  clearTimeout(proactiveTimer);
  proactiveTimer = null;
  if(!settings.name || !settings.key) return;
  if(!settings.proactiveMin || settings.proactiveMin <= 0) return;
  var wait = (typeof ms === 'number') ? ms : nextProactiveWait();
  proactiveDueAt = Date.now() + wait;
  proactiveTimer = setTimeout(onProactiveTick, wait);
}
function onProactiveTick(){
  proactiveTimer = null;
  if(busy) return armProactive(5 * 60000);
  if(!settings.name || !settings.key) return armProactive(5 * 60000);
  if(!settings.proactiveMin || settings.proactiveMin <= 0) return;
  if($('overlay').classList.contains('show')) return armProactive(5 * 60000);
  if(isNightQuiet()) return armProactive(5 * 60000);
  if(pad.p <= 3) return armProactive(10 * 60000);
  var since = Date.now() - lastActivity;
  var minMs = proactiveTiers()[0] * 60000;
  if(since < minMs) return armProactive(minMs - since);
  lastActivity = Date.now();
  proactiveSend();
}
function startProactive(){ armProactive(); }
function handleVisibility(){
  if(document.hidden) return;
  if(!proactiveTimer) return;
  var remain = proactiveDueAt - Date.now();
  clearTimeout(proactiveTimer);
  proactiveTimer = null;
  if(remain <= 0){ onProactiveTick(); }
  else { proactiveTimer = setTimeout(onProactiveTick, remain); }
}

function resizeToDataURL(file, max, type, cb){
  var fr = new FileReader();
  fr.onload = function(){
    var img = new Image();
    img.onload = function(){
      var scale = Math.min(1, max / Math.max(img.width, img.height));
      var cw = Math.max(1, Math.round(img.width * scale));
      var ch = Math.max(1, Math.round(img.height * scale));
      var cv = document.createElement('canvas');
      cv.width = cw; cv.height = ch;
      cv.getContext('2d').drawImage(img, 0, 0, cw, ch);
      cb(cv.toDataURL(type, 0.85));
    };
    img.onerror = function(){ toast('图片读取失败'); };
    img.src = String(fr.result);
  };
  fr.onerror = function(){ toast('文件读取失败'); };
  fr.readAsDataURL(file);
}

function recallMsg(idx){
  if(busy || isRendering){ toast('对方正在回复中，请稍后再操作'); return; }

  if(m._director && window._lastDirTimerId){

  chat.splice(idx, 1);
  lastRecallTs = Date.now();

  renderChat();
  toast('已撤回');
}

function uvCount(arr){
  var n = 0;
  for(var i = 0; i < arr.length; i++){ if(arr[i].role === 'user' || arr[i].role === 'assistant') n++; }
  return n;
}
function uvSinceDiary(){
  var base = (typeof mem.diaryAt === 'number') ? mem.diaryAt : 0;
  var total = uvCount(chat);
  var since = total - base;
  return since < 0 ? 0 : since;
}
function renderAIBubbles(parsed){
  if(!parsed || !Array.isArray(parsed.parts)) return;
  // Clear any previous render timers
  for(var ti = 0; ti < renderTimers.length; ti++) clearTimeout(renderTimers[ti]);
  renderTimers = [];
  isRendering = true;
  var delay = 0;
  var totalParts = parsed.parts.length;
  var renderedCount = 0;
  for(var i = 0; i < totalParts; i++){
    (function(txt, d, isLast){
      var tid = setTimeout(function(){
        if(!$('overlay').classList.contains('show')) appendMsg('assistant', txt);
        renderedCount++;
        if(isLast && !parsed.recall){ isRendering = false; }
      }, d);
      renderTimers.push(tid);
    })(parsed.parts[i], delay, i === totalParts - 1);
    delay += 1000 + Math.floor(Math.random() * 2001);
  }
  if(parsed.recall){
    var tid2 = setTimeout(function(){
      for(var j = chat.length - 1; j >= 0; j--){
        if(chat[j].role === 'assistant'){
          chat.splice(j, 1);
          chat.push({ role: 'system', content: '[对方撤回了一条消息]', t: Date.now() });
          saveChat();
          if(!busy) renderChat();
          break;
        }
      }
      isRendering = false;
    }, delay + 5000);
    renderTimers.push(tid2);
  }
}

async function callAI(mode){
  var recallPending = lastRecallTs && Date.now() - lastRecallTs < 120000;
  var url = settings.base.trim();
  while(url.charAt(url.length - 1) === '/') url = url.slice(0, -1);
  if(url.indexOf('/chat/completions') < 0) url += '/chat/completions';
  var msgs = [{ role: 'system', content: systemPrompt(mode) }].concat(recentMsgs());
  if(recallPending) lastRecallTs = 0;
  if(mode === 'pro'){
    msgs.push({ role: 'user', content: '（对方现在没有说话。轮到你主动给对方发一条消息，直接说出来即可。）' });
  }
  var resp = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + settings.key },
    body: JSON.stringify({ model: settings.model, temperature: settings.temp, max_tokens: 1024, stream: false, messages: msgs })
  });
  if(!resp.ok){ var t = await resp.text(); throw new Error('HTTP ' + resp.status + ' ' + t.slice(0, 200)); }
  var data = await resp.json();
  recordGoodAPI(settings.base, settings.key, settings.model);
  var c = data.choices && data.choices[0] && data.choices[0].message;
  return c && c.content ? parseReply(c.content) : { parts: ['（对方没有回应）'], inner: '', diary: '' };
}

  return true;
}

    setBusy(false);
    if(e instanceof TypeError || e instanceof ReferenceError || e instanceof SyntaxError){
      console.error('[运行时错误]', e);
      appendMsg('error', '[程序错误] ' + e.message + '（已记录到控制台，非网络问题）');
    } else if(e.message && e.message.indexOf('HTTP ') === 0){
      appendMsg('error', '[接口错误] ' + e.message + '。请检查 API Key、模型名称或接口地址。');
    } else {
      appendMsg('error', '[连接失败] ' + e.message + '。请检查网络或接口地址。');
    }
  });
}

  var txt = $('input').value.trim();
  if(!txt || busy) return;
  if(!checkReady()) return;
  $('input').value = ''; autoResize();
  closeStickerPanel();
  if(directorMode){
    // Director mode: send [暗中设定：...] to API immediately, delay hint rendering
    var directorText = txt;

    chat[chat.length - 1]._director = directorText;

    $('input').classList.remove('director-mode');
    $('input').placeholder = '说点什么…（Enter 发送，Shift+Enter 换行）';
    touchActivity();
    runAI();
    // Delayed hint rendering (10s fade-in)
    if(!settings.directorHide){
      var hintText = settings.directorHint || '[你设定了新剧情]';
      var dirTimerId = setTimeout(function(){
        var chatEl = $('chat');
        var hintDiv = document.createElement('div');
        hintDiv.className = 'msg-director-hint msg-director-fadein';
        hintDiv.textContent = hintText;
        hintDiv.setAttribute('data-dir-idx', String(chat.length - 1));

          var idx = parseInt(this.getAttribute('data-dir-idx'));

            if(confirm('撤回这条剧情设定？')){
              chat.splice(idx, 1);
              saveChat(); renderChat();
            } else {
              this.style.display = 'none';
            }
          } else {
            this.style.display = 'none';
          }
        });
        chatEl.appendChild(hintDiv);
        chatEl.scrollTop = chatEl.scrollHeight;
        window._lastDirTimerId = null;
      }, 10000);
      window._lastDirTimerId = dirTimerId;
      window._lastDirChatIdx = chat.length - 1;
    }
    return;
  }
  appendMsg('user', txt);
  addAff(affDelta(txt));
  touchActivity();
  runAI();

      $('fBase').value = apiBase;
      $('fModel').value = apiModel;
      applyKeyMask();
      toast('已恢复上次可用的 API');
    }
  }
  keyDraft = apiKey;
  settings.base = apiBase;
  settings.key = apiKey;
  settings.model = apiModel;
  settings.temp = parseFloat($('fTemp').value) || 1.2;
  settings.name = name;
  settings.gender = $('fGender').value;
  settings.age = $('fAge').value.trim();
  settings.relation = $('fRelation').value.trim() || '朋友';
  settings.personality = $('fPersonality').value.trim();
  settings.style = $('fStyle').value.trim();
  settings.greeting = $('fGreeting').value.trim();
  settings.aff = parseInt($('fAff').value, 10);
  settings.neverAdmit = $('fAdmit').checked;
  var taAv = $('fTaAvatar').value.trim();
  if(taAv) settings.avatar = taAv;
  var uAv = $('fUserAvatar').value.trim();
  if(uAv) settings.avatarUser = uAv;
  settings.hideAvatars = $('fHideAvatars').checked;
  settings.allowReject = $('fAllowReject').checked;
  settings.proactiveMin = Math.max(0, Math.min(1440, parseInt($('fProactiveMin').value, 10) || 0));
  settings.chatter = $('fChatter').value || 'auto';
  settings.nightQuiet = $('fNightQuiet').checked;
settings.sleepStart = $('fSleepStart').value || '23:00';
settings.sleepEnd = $('fSleepEnd').value || '07:00';
  settings.catchphrases = $('fCatchphrases').value.trim();
  settings.tags = ($('fTags').value || '').split(/[,，]/).map(function(t){return t.trim()}).filter(Boolean);
  // Sync tags to active contact object
  var ac = getActiveContact(); if(ac) ac.tags = settings.tags;
settings.bgMode = $('fBgMode').value || 'warm';
settings.emotionLink = $('fEmotionLink').checked;
  settings.bgOpacity = Math.max(0, Math.min(1, parseFloat($('fBgOpacity').value) || 0.3));
  settings.directorHint = $('fDirectorHint').value.trim() || '[你设定了新剧情]';
  settings.directorHide = $('fDirectorHide').checked;

  saveSettings();
  headerUI();
  startProactive();
  closeSettings();
  toast('已保存，生效中');
}

function bind(){
  $('btnSend').addEventListener('click', send);
  $('btnFetchModels').addEventListener('click', fetchModels);
  $('btnRestoreApi').addEventListener('click', restoreGoodAPI);
  $('btnKeyEye').addEventListener('click', function(){ keyShown = !keyShown; applyKeyMask(); });
  $('fKey').addEventListener('focus', function(){ applyKeyMask(); });
  $('fKey').addEventListener('input', function(){ keyDraft = this.value; });
  $('fKey').addEventListener('blur', function(){ applyKeyMask(); });
  $('input').addEventListener('keydown', function(e){
    if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); }
  });
  $('input').addEventListener('input', function(){ autoResize(); touchActivity(); });
  $('btnSettings').addEventListener('click', openSettings);
  $('charNameWrap').addEventListener('click', toggleContactPanel);
  $('btnAddContact').addEventListener('click', function(){
    var n = prompt('输入新联系人名字：');
    if(n && n.trim()){
      addContact(n.trim());
      // 新建后自动打开设置面板，表单已由 populate() 用默认值填充
      openSettings();
    }
  });
  document.addEventListener('click', function(e){
    var cp = $('contactPanel');
    var wrap = $('charNameWrap');
    if(cp && cp.classList.contains('show') && !cp.contains(e.target) && !wrap.contains(e.target)) closeContactPanel();
  });
  $('btnInner').addEventListener('click', function(e){ e.stopPropagation(); toggleInnerPanel(); });
  $('btnClose').addEventListener('click', closeSettings);
  $('overlay').addEventListener('click', function(e){ if(e.target === $('overlay')) closeSettings(); });
  $('btnSave').addEventListener('click', saveFromForm);
  $('btnClear').addEventListener('click', function(){
    if(!confirm('清空聊天记录？角色设定会保留。')) return;
    chat = [];
    if(settings.greeting) chat.push({ role: 'assistant', content: settings.greeting, t: Date.now() });
    innerLogs = [];
    saveChat(); saveInner(); renderChat(); renderInnerPanel(); closeSettings();
  });
  $('btnGenTopic').addEventListener('click', generateTopics);
  $('btnReset').addEventListener('click', function(){
    if(!confirm('恢复出厂设置？所有本地数据将被删除。')) return;
    localStorage.removeItem(LS_SET);
    localStorage.removeItem(LS_GOOD);
    localStorage.removeItem(LS_CHAT);
    localStorage.removeItem(LS_MEM);
    localStorage.removeItem(LS_PAD);
    localStorage.removeItem(LS_INNER);
    localStorage.removeItem(LS_CONTACTS);
    location.reload();
  });
  $('fTemp').addEventListener('input', function(){ $('fTempVal').textContent = $('fTemp').value; });
  $('fBgOpacity').addEventListener('input', function(){ $('fBgOpVal').textContent = this.value; settings.bgOpacity = parseFloat(this.value)||0.3; applyAppearance(); });
  $('fBgMode').addEventListener('change', function(){ settings.bgMode = this.value; applyAppearance(); });
  $('fEmotionLink').addEventListener('change', function(){ settings.emotionLink = this.checked; applyAppearance(); });
  $('fNightQuiet').addEventListener('change', function(){
    $('fSleepStart').disabled = !this.checked;
    $('fSleepEnd').disabled = !this.checked;
  });
  $('fAff').addEventListener('input', function(){ $('fAffVal').textContent = $('fAff').value; });
  $('btnEmoji').addEventListener('click', openStickerPanel);
  $('btnDirector').addEventListener('click', toggleDirectorMode);
  $('btnStickerAdd').addEventListener('click', function(){ $('stickerFile').click(); });
  $('stickerFile').addEventListener('change', onStickerFile);
  $('btnTaAvatarUpload').addEventListener('click', function(){ uploadAvatar('ta'); });
  $('btnUserAvatarUpload').addEventListener('click', function(){ uploadAvatar('user'); });
  $('btnTaAvatarClear').addEventListener('click', function(){ clearAvatar('ta'); });
  $('btnUserAvatarClear').addEventListener('click', function(){ clearAvatar('user'); });
  $('btnMemToggle').addEventListener('click', function(){ var el = $('memList'); el.classList.toggle('show'); if(el.classList.contains('show')) renderMemUI(); });
  $('btnMemClear').addEventListener('click', function(){
    if(!confirm('清空角色对你的全部记忆（长期事实 + 事件日记）？')) return;
    mem = { facts: [], events: [], diaryAt: 0 };
    saveMem();
    renderMemUI();
    toast('记忆已清空');
  });
  $('btnCleanSleep').addEventListener('click', function(){
    var sleepRe = /睡觉|晚安|困了|早点睡|去睡|休息吧|该睡了|入睡|熬夜|别熬|快睡|赶紧睡|好好休息|早点休息/i;
    var before = chat.length;
    var cleaned = [];
    for(var i = 0; i < chat.length; i++){
      var m = chat[i];
      if(m.role === 'assistant' && sleepRe.test(m.content || '')) continue;
      cleaned.push(m);
    }
    var removed = before - cleaned.length;
    if(removed === 0){ toast('未发现睡眠污染消息，无需清理'); return; }
    if(!confirm('将删除 ' + removed + ' 条含"睡觉/晚安/困了"等内容的 AI 回复。确认？')) return;
    chat = cleaned;
    saveChat();
    renderChat();
    var evBefore = mem.events.length;
    mem.events = mem.events.filter(function(e){ return !sleepRe.test(e.text || ''); });
    var evRemoved = evBefore - mem.events.length;
    saveMem();
    renderMemUI();
    toast('已清理 ' + removed + ' 条聊天记录' + (evRemoved > 0 ? ' + ' + evRemoved + ' 条事件日记' : ''));
  });
  $('fTaAvatar').addEventListener('input', renderAvPreview);
  $('fUserAvatar').addEventListener('input', renderAvPreview);
  window.addEventListener('keydown', function(e){ if(e.key === 'Escape'){ closeSettings(); closeStickerPanel(); closeInnerPanel(); } });
  document.addEventListener('visibilitychange', handleVisibility);
}

function init(){
  loadContacts();
  // 确保全局 settings 与当前活跃联系人同步
  var ac = getActiveContact();
  if(ac && ac.settings){
    for(var k in ac.settings){ if(Object.prototype.hasOwnProperty.call(ac.settings, k)) settings[k] = ac.settings[k]; }
  }
  loadSettings();
  loadGoodAPI();
  loadMem();
  loadPad();
  loadInner();
  loadChat();
  ensureDataIntegrity();
  bind();
  // 静默预生成话题池（后台异步，不阻塞UI）
  setTimeout(function(){ refillFallbackPool(); silentPreGenerate(); }, 2000);
}
init();
headerUI();
renderChat();
touchActivity();
startProactive();
if(!settings.key){ setTimeout(openSettings, 400); }
</script>
<div id="ctxMenu" class="ctx-menu"><div class="ctx-item" id="ctxRecall">撤回</div><div class="ctx-item danger" id="ctxDelete">删除</div></div>
</body>
</html>
